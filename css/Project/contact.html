  <div class="contact-box">




      <div class="form-container">
    
          <h1 class="head-text">Contact Us</h1>
          <form action="">
              <div class="input-box">
    
                  <label for="">Name:</label> <br>
                  <input type="text" placeholder="Rahul Kumar"><br>
              </div>
              <div class="input-box">
                  <label for="">E-mail:</label><br>
                  <input type="email" placeholder="example@gmail.com"><br>
              </div>
    
    
              <div class="input-box">
                  <label for="">Phone Number:</label><br>
                  <input type="tel" placeholder="+91 9876543210"><br>
              </div>
    
              <div class="text-area">
                  <label for="">Message:</label> <br>
                  <textarea name="" id="" placeholder="Type your message...."></textarea>
              </div>
    
              <div>
                  <button id="btn"><a id="btn-a" href="#">Send Message</a></button>
              </div>
          </form>
    
          <!-- <p>Didn't have an account..? <a href="./register.html">Register</a> </p> -->
