<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./auth.css">
</head>

<body>
    <div class="form-container">

        <h1 class="head-text">Register</h1>
        <form action="">
            <div class="input-box">

                <label for="">Name:</label> <br>
                <input type="text" placeholder="Rahul Kumar"><br>
            </div>
            <div class="input-box">
                <label for="">E-mail:</label><br>
                <input type="email" placeholder="example@gmail.com"><br>
            </div>


            <div class="input-box">
                <label for="">Phone Number:</label><br>
                <input type="tel" placeholder="+91 9876543210"><br>
            </div>

            <div class="input-box">
                <label for="">Password:</label><br>
                <input type="password" placeholder="Type a strong password"><br>

            </div>
            <div class="input-box">

                <label for="">Confirm Password:</label><br>
                <input type="password" placeholder="Re-type your password"><br>

            </div>

            <div>
                <button id="btn"><a id="btn-a" href="./login.html">Register</a></button>
            </div>
        </form>

        <p>Already have an account..? <a href="./login.html">Login</a> </p>
    </div>
</body>

</html>
