<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            background-color: green;
        }
    </style>
</head>
<body>
 <h1>Student Registration Form</h1>

<form> 
    <label for="">Full Name:</label>
    <input type="text" placeholder="Rahul Kumar" name="fname" required>
    <br> <br>

    <label for="">E-Mail:</label>
    <input type="email" placeholder="example@html.com" name="email" required>
<br> <br>
    <label for="">Password:</label>
    <input type="password" placeholder="Enter a Strong Password" name="password">
<br> <br>
    <label for="">Age:</label>
    <input type="number" placeholder="Age" name="age">
<br> <br>
    <label for="">D.O.B :</label>
    <input type="date" name="dob">
<br> <br>
    <label for="">Time:</label>
    <input type="time">
<br> <br>
    <label for="">Phone:</label>
    <input type="tel" name="phone" placeholder="+91 9876543210">
<br> <br>

<label for="">Gender:</label>

<input type="radio">
<label for="male">Male</label>

<input type="radio">
<label for="female">Female</label>

<br> <br>
<label for="">Skills:</label>

<input type="checkbox">
<label for="html">HTML</label>

<input type="checkbox">
<label for="">CSS</label>

<input type="checkbox">
<label for="">JS</label>

<br> <br>
<label for="">Course:</label>

<select name="" id="">
    <option value="" >--Select Course--</option>
    <option value="">BA</option>
    <option value="">B.Com</option>
    <option value="">B.Sc</option>
    <option value="">BCA</option>
    <option value="">BBA</option>
    <option value="">MBA</option>
    <option value="">B.Tech</option>
</select>
<br> <br>
 <label for="">Color:</label>
 <input type="color">
<br> <br>
<label for="">Fee:</label>
<input type="range" min="0" max="100">

<br> <br>
<label for="">Documents:</label>
<input type="file" required>

<br> <br>
  <label for="">Search:</label>
  <input type="search" placeholder="Search Keyword">
<br> <br>
    <input type="submit">
    
</form>
    
</body>
</html>
